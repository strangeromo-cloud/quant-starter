# 量化平台 nginx 配置参考。
#
# ⚠️ 实际部署不是放在 conf.d/ 单独文件 —— 服务器 nginx 只挂载了单个
#    /opt/ctj/nginx/default.conf（不是整个 conf.d 目录）。所以 quant 的 server 块
#    是【追加】在 /opt/ctj/nginx/default.conf 末尾的。改 nginx 要编辑那个文件，
#    并用一次性容器隔离校验（见下）后【重启】nginx（不是 reload，因 reload 读不到
#    宿主机新文件）。
#
# 当前已部署的是下面这个 HTTP 块（已生效，http://quant.xiuqilai.com 可用）：

server {
    listen 80;
    server_name quant.xiuqilai.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / {
        proxy_pass http://quant-web:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

# 已部署的还有一个 443 块（HTTPS），暂时借用 ctj-api 的证书（quant-*.pem 是其副本），
# 所以浏览器有证书名不匹配警告。下面是签 quant 自己证书、消除警告的步骤：
#
# 已就绪：quant HTTP 块的 acme 验证目录指向 /var/www/static
#         （= 宿主机 /opt/ctj/static，已挂载进 nginx，certbot webroot 可用）
#
# 你来跑（需 sudo）：
#   sudo certbot certonly --webroot -w /opt/ctj/static -d quant.xiuqilai.com
#   sudo cp /etc/letsencrypt/live/quant.xiuqilai.com/fullchain.pem /opt/ctj/ssl/quant-fullchain.pem
#   sudo cp /etc/letsencrypt/live/quant.xiuqilai.com/privkey.pem   /opt/ctj/ssl/quant-privkey.pem
#   sudo chown xujz:xujz /opt/ctj/ssl/quant-*.pem
#   docker restart nginx
# 完成后 https://quant.xiuqilai.com 无警告。nginx 配置无需再改（已引用 quant-*.pem）。
#
# 自动续期：certbot renew 只更新 /etc/letsencrypt，不会自动覆盖 /opt/ctj/ssl 的副本。
#   在续期 deploy-hook 里加上述 cp + docker restart nginx（与 CTJ 证书同理）。
